server:
  port: 8088

spring:
  application:
    name: nexpos-monolith
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/marketcali_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:miguel}
    password: ${SPRING_DATASOURCE_PASSWORD:12345}
    # El driver y el dialecto se detectan por la URL: MySQL en local
    # (docker compose) y Azure SQL en la nube.
  jpa:
    hibernate:
      # En Azure se usa `validate`: el esquema lo gestiona solo Flyway.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    # Migraciones por motor: db/migration/mysql y db/migration/sqlserver
    locations: classpath:db/migration/{vendor}

# Actuator Health & Metrics
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"
  endpoint:
    health:
      show-details: always

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost,http://127.0.0.1:5173}
  admin:
    # Contraseña del usuario admin inicial (solo si no existe). En Azure: Key Vault.
    password: ${ADMIN_PASSWORD:admin}

jwt:
  # Obligatorio: sin valor por defecto para que nunca se despliegue con un
  # secreto conocido. En Azure lo entrega Key Vault.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    org.springframework.security: INFO
    org.flywaydb: INFO
