name: Infra

# Infraestructura de NexPOS (infra/terraform) con el pipeline estándar de la
# plataforma: plan en cada PR, apply en master con aprobación (environment prod).
on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [master]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  prod:
    uses: miguelortiz13/terraform-modules-iac/.github/workflows/terraform-azure.yml@v0.2.0
    with:
      working-directory: infra/terraform
      environment: prod
