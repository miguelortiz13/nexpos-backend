name: NexPOS Backend CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Pipeline armado con los workflows estándar de miguelortiz13/github-workflows;
# el smoke test con docker compose es propio del proyecto y se queda aquí.
permissions:
  contents: read

jobs:
  security-scan:
    name: Security baseline
    uses: miguelortiz13/github-workflows/.github/workflows/security-baseline.yml@v0.2.0
    permissions:
      contents: read
      pull-requests: write

  build-and-test:
    name: Maven Compile & Unit Tests
    needs: security-scan
    uses: miguelortiz13/github-workflows/.github/workflows/build-java-maven.yml@v0.2.0
    with:
      java-version: "17"
      command: mvn --batch-mode --no-transfer-progress clean package

  smoke-test-e2e:
    name: End-to-End Live Container Smoke Test
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Database & Monolith App
        run: |
          # Secreto efímero solo para la prueba: la app ya no trae uno por defecto.
          echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')" > .env
          docker compose up -d mysql-db monolith-app

      - name: Wait for Spring Boot & MySQL Health
        run: |
          echo "Waiting for NexPOS Monolith to become healthy on port 8088..."
          for i in {1..30}; do
            HEALTH=$(curl -s http://localhost:8088/actuator/health | grep '"status":"UP"' || true)
            if [ -n "$HEALTH" ]; then
              echo "✅ NexPOS Monolith is UP and Healthy!"
              break
            fi
            echo "Attempt $i/30: Waiting 3s..."
            sleep 3
          done
          curl -f -s http://localhost:8088/actuator/health || (docker compose logs && exit 1)

      - name: Verify Swagger UI Availability
        run: |
          curl -f -s -I http://localhost:8088/swagger-ui/index.html | grep -E "HTTP/1.1 (200|302)"
          echo "✅ Swagger UI responds properly"

      - name: Teardown Services
        if: always()
        run: docker compose down -v

  docker-publish:
    name: Imagen (build, Trivy y GHCR)
    needs: [build-and-test, smoke-test-e2e]
    uses: miguelortiz13/github-workflows/.github/workflows/container-build.yml@v0.2.0
    permissions:
      contents: read
      packages: write
    with:
      image-name: nexpos-backend
      dockerfile: monolith-app/Dockerfile
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

  sign:
    name: Firma y SBOM (Cosign)
    needs: docker-publish
    if: needs.docker-publish.outputs.ref != ''
    uses: miguelortiz13/github-workflows/.github/workflows/container-sign.yml@v0.2.0
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      image-ref: ${{ needs.docker-publish.outputs.ref }}

  deploy-azure:
    name: Deploy API to Azure Container Apps
    # Solo se despliega una imagen firmada.
    needs: [docker-publish, sign]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # Environment protegido: aprobación obligatoria y solo rama master.
    uses: miguelortiz13/github-workflows/.github/workflows/deploy-azure-container-app.yml@v0.2.0
    permissions:
      contents: read
      id-token: write
    with:
      environment: prod
      app-name: ${{ vars.NEXPOS_API_APP }}
      resource-group: ${{ vars.NEXPOS_RESOURCE_GROUP }}
      image: ${{ needs.docker-publish.outputs.image }}:${{ needs.docker-publish.outputs.tag }}
      health-path: /actuator/health
      health-expect: '"status":"UP"'
