name: NexPOS Backend CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nexpos-backend

jobs:
  security-scan:
    name: DevSecOps Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Maven Compile & Unit Tests
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Run Unit Tests
        run: mvn clean test --batch-mode

      - name: Verify Package & Artifact Assembly
        run: mvn package -DskipTests --batch-mode

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: '**/target/surefire-reports/*'
          if-no-files-found: ignore

  smoke-test-e2e:
    name: End-to-End Live Container Smoke Test
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Database & Monolith App
        run: |
          # Secreto efímero solo para la prueba: la app ya no trae uno por defecto.
          echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')" > .env
          docker compose up -d mysql-db monolith-app

      - name: Wait for Spring Boot & MySQL Health
        run: |
          echo "Waiting for NexPOS Monolith to become healthy on port 8088..."
          for i in {1..30}; do
            HEALTH=$(curl -s http://localhost:8088/actuator/health | grep '"status":"UP"' || true)
            if [ -n "$HEALTH" ]; then
              echo "✅ NexPOS Monolith is UP and Healthy!"
              break
            fi
            echo "Attempt $i/30: Waiting 3s..."
            sleep 3
          done
          curl -f -s http://localhost:8088/actuator/health || (docker compose logs && exit 1)

      - name: Verify Swagger UI Availability
        run: |
          curl -f -s -I http://localhost:8088/swagger-ui/index.html | grep -E "HTTP/1.1 (200|302)"
          echo "✅ Swagger UI responds properly"

      - name: Teardown Services
        if: always()
        run: docker compose down -v

  docker-publish:
    name: Build, Scan & Publish Docker Image (GHCR)
    runs-on: ubuntu-latest
    needs: [build-and-test, smoke-test-e2e]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Monolith Docker Image
        run: |
          docker build \
            -f monolith-app/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy-azure:
    name: Deploy API to Azure Container Apps
    runs-on: ubuntu-latest
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # Environment protegido: aprobación obligatoria y solo rama master.
    environment: prod

    steps:
      - name: Azure Login (OIDC, sin secretos)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image
        run: |
          az containerapp update \
            --name "${{ vars.NEXPOS_API_APP }}" \
            --resource-group "${{ vars.NEXPOS_RESOURCE_GROUP }}" \
            --image "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --output none

      - name: Post-deploy health check
        run: |
          fqdn=$(az containerapp show -n "${{ vars.NEXPOS_API_APP }}" -g "${{ vars.NEXPOS_RESOURCE_GROUP }}" --query properties.configuration.ingress.fqdn -o tsv)
          # Arranque en frío + reanudación de la base gratis: hasta ~2 minutos.
          for i in $(seq 1 24); do
            if curl -sf "https://$fqdn/actuator/health" | grep -q '"status":"UP"'; then
              echo "✅ API UP en https://$fqdn"; exit 0
            fi
            echo "Intento $i/24: esperando 10s..."; sleep 10
          done
          echo "::error::La API no respondió UP tras el despliegue"; exit 1
