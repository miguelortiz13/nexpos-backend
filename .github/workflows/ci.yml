name: NexPOS Backend CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    name: Build & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Run Unit Tests
        run: mvn clean test --batch-mode

      - name: Verify Package & Artifact Assembly
        run: mvn package -DskipTests --batch-mode

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: '**/target/surefire-reports/*'
          if-no-files-found: ignore

  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Monolith Docker Image
        run: |
          docker build \
            -f monolith-app/Dockerfile \
            -t nexpos-monolith-app:${{ github.sha }} \
            -t nexpos-monolith-app:latest \
            .
